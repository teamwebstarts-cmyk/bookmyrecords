name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/chatbot]

permissions:
  contents: read

jobs:
  test:
    name: Node.js test and chatbot retrieval checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression and chatbot unit tests
        run: npm test

      - name: Evaluate chatbot knowledge retrieval
        run: npm run index:chatbot
